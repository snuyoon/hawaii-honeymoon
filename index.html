<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 둘의 하와이</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E7; --page:#FFFCF6; --ink:#293A36; --ink-2:#626B60; --ink-3:#8E958A;
  --teal:#2D706C; --teal-l:#E3EEEC; --rust:#A94F3D; --rust-l:#F3E4DF;
  --line:#E4DCCB; --line-2:#D3C9B4; --gold:#C9A24A;
  --r:6px; --fs:15px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:var(--fs);line-height:1.65;font-variant-numeric:tabular-nums}
a{color:var(--teal);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--teal) 35%,transparent)}
a:hover{border-bottom-color:var(--teal)}
button{font-family:inherit;cursor:pointer;color:inherit}
.serif{font-family:"Gowun Batang",serif}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* 제호 */
header{display:flex;align-items:flex-end;gap:28px;padding:16px 28px 12px;background:var(--paper);border-bottom:1px solid var(--line-2);position:relative}
header h1{margin:0;font-family:"Gowun Batang",serif;font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.15;white-space:nowrap}
header h1 small{display:block;font-family:Pretendard,sans-serif;font-size:12.5px;font-weight:400;color:var(--ink-2);letter-spacing:.2px;margin-top:4px}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;padding-bottom:6px;color:var(--ink-2)}
.crumbs button{background:none;border:0;padding:0;font-size:14px;color:var(--ink-2);border-bottom:1px solid transparent}
.crumbs button:hover{border-bottom-color:var(--ink-2)}
.crumbs button.cur{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.crumbs span{color:var(--ink-3)}
.htools{margin-left:auto;display:flex;gap:14px;align-items:baseline;padding-bottom:6px;font-size:13px;color:var(--ink-2)}
.hdate{display:flex;align-items:baseline;gap:8px}
.hdate input{border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:2px 2px;font-family:inherit;font-size:13.5px;color:var(--ink)}
.sync{font-size:12px;color:var(--ink-3);white-space:nowrap}
.sync.on{color:var(--teal)}
.sync.bad{color:var(--rust)}
.confirm-row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--rust)}
.hdday{font-family:"Gowun Batang",serif;font-size:15px;color:var(--rust);font-weight:700;letter-spacing:.5px}
/* 본문 */
.main{display:grid;grid-template-columns:minmax(0,1fr) clamp(400px,38vw,540px);min-height:0}
#map{height:100%;min-height:0;background:#cfe3e8}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--page);border-left:1px solid var(--line-2);position:relative}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='1'/></svg>")}
.tabs{display:flex;gap:26px;padding:14px 28px 0;border-bottom:1px solid var(--line);background:var(--page)}
.tabs button{border:0;background:none;padding:6px 0 12px;font-size:15px;color:var(--ink-2);border-bottom:2px solid transparent;font-weight:500;letter-spacing:-.1px}
.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:700}
.tabs button small{font-weight:400;color:var(--ink-3);margin-left:4px;font-size:12.5px}
.pbody{overflow:auto;padding:26px 28px 60px;min-height:0;scroll-behavior:smooth;position:relative}
h2{font-family:"Gowun Batang",serif;font-size:24px;margin:0 0 6px;letter-spacing:-.4px;line-height:1.3;font-weight:700}
h3{font-family:"Gowun Batang",serif;font-size:19px;margin:34px 0 12px;letter-spacing:-.2px;font-weight:700}
h4{margin:0;font-size:17px;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:13.5px;line-height:1.55}
.meta{color:var(--ink-3);font-size:12.5px;letter-spacing:.1px}
.eyebrow{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.lead{font-size:16px;line-height:1.7;color:var(--ink)}
.rule{border:0;border-top:1px solid var(--line);margin:28px 0}
.dots > *+*::before{content:"·";color:var(--ink-3);margin:0 7px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
/* 필터 칩 (실제 필터·선택에만) */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;background:transparent;font-size:13px;color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.sel{background:var(--ink);color:var(--page);border-color:var(--ink)}
button.chip:hover{border-color:var(--ink)}
.tag{display:inline-block;font-size:12px;color:var(--rust);border:1px solid var(--rust);padding:1px 7px;border-radius:3px;letter-spacing:.3px}
.tag.soft{color:var(--ink-2);border-color:var(--line-2)}
.stars{position:relative;display:inline-block;font-size:13px;letter-spacing:1px;line-height:1;vertical-align:-1px}
.stars-bg{color:#DED5C2}
.stars-fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold)}
.score{font-weight:700;margin-left:4px}
/* 버튼 */
.btn{border:1px solid var(--line-2);background:transparent;border-radius:var(--r);padding:7px 13px;font-size:14px;color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:#245c58}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;color:var(--ink-2);padding-left:4px;padding-right:4px}
.btn.ghost:hover{color:var(--ink);border-color:transparent;text-decoration:underline}
.btn svg{width:14px;height:14px}
.link{background:none;border:0;padding:0;color:var(--teal);font-size:inherit;border-bottom:1px solid color-mix(in srgb,var(--teal) 35%,transparent)}
/* 두 사람의 선택 */
.picks{display:inline-flex;align-items:center;gap:5px;flex:none}
.pk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--page);font-family:"Gowun Batang",serif;font-weight:700;font-size:13px;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.pk:hover{border-color:var(--ink);color:var(--ink)}
.pk.on{background:var(--ink);border-color:var(--ink);color:var(--page)}
.pk.on.b{background:var(--teal);border-color:var(--teal)}
.stamp{display:inline-block;font-family:"Gowun Batang",serif;font-size:11.5px;font-weight:700;color:var(--rust);border:1.5px solid var(--rust);border-radius:4px;padding:2px 7px;letter-spacing:1px;transform:rotate(-5deg);margin-left:6px;opacity:.95;white-space:nowrap}
.stamp.sm{font-size:10px;padding:1px 5px;letter-spacing:.6px}
/* 목록 항목 (상자 대신 가는 선) */
.entry{padding:20px 0;border-bottom:1px solid var(--line)}
.entry:first-child{padding-top:6px}
.entry.dim{opacity:.4}
.entry.flash{background:var(--rust-l);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:var(--r)}
.entry.click{cursor:pointer}
.entry.click:hover h4, .entry.click:hover .title{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.entry .title{font-family:"Gowun Batang",serif;font-size:20px;font-weight:700;letter-spacing:-.3px}
.entry .en{color:var(--ink-3);font-size:13px;font-family:Pretendard,sans-serif;font-weight:400;margin-left:6px}
.photo{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;border-radius:var(--r);background:#E9E2D3;margin:0 0 12px}
.photo-wrap{position:relative;margin-bottom:12px}
.photo-wrap .photo{margin:0}
.photo-wrap .cap{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.photo-wrap .cap span{background:rgba(41,58,54,.78);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:3px;letter-spacing:.3px}
.ph{aspect-ratio:3/2;border-radius:var(--r);background:linear-gradient(135deg,#E9E2D3,#D8E6E3);display:flex;align-items:center;justify-content:center;color:var(--ink-3);margin-bottom:12px}
.ph svg{width:40px;height:40px}
.list-entry{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.thumb{width:76px;height:76px;border-radius:var(--r);overflow:hidden;background:#E9E2D3;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:26px;height:26px}
.price-line{margin-top:10px;font-size:14px}
.price-line b{font-size:18px;font-family:"Gowun Batang",serif;letter-spacing:-.2px}
.price-line .range{color:var(--ink-2);margin-left:8px;font-size:13px}
.why{font-size:15px;line-height:1.6;margin:6px 0 0}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.pc ul{margin:6px 0 0;padding-left:16px}
.pc li{margin:3px 0;font-size:13.5px;line-height:1.5}
.pc b{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
.srcs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.srcs a{color:var(--ink-2);border-bottom-color:var(--line-2)}
.srcs b{color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;margin-top:6px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.list{margin:6px 0 0;padding-left:17px} .list li{margin:4px 0;font-size:14px;line-height:1.55}
.seg{display:flex;gap:18px;margin:26px 0 4px;border-bottom:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 0 10px;font-weight:500;color:var(--ink-2);font-size:14.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--ink);border-color:var(--ink);font-weight:700}
.seg button small{color:var(--ink-3);margin-left:3px;font-weight:400}
details{margin:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
details+details{border-top:0;margin-top:-14px}
details summary{cursor:pointer;padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:15px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";color:var(--ink-3);font-weight:400}
details[open] summary::after{content:"－"}
details > div{padding:2px 0 16px}
details.plain{border:0;margin:6px 0}
details.plain summary{padding:6px 0;font-weight:500;color:var(--ink-2);font-size:13.5px;justify-content:flex-start;gap:6px}
details.plain summary::after{content:"더 보기";font-size:12px}
details.plain[open] summary::after{content:"접기"}
.src-link{font-size:12px;color:var(--ink-3)}
.src-link a{color:var(--ink-3);border-bottom-color:var(--line-2)}
.note{font-size:13.5px;padding:9px 12px;border-left:2px solid var(--rust);background:var(--rust-l);color:var(--ink);margin:8px 0;border-radius:0 var(--r) var(--r) 0}
.note.info{border-left-color:var(--teal);background:var(--teal-l)}
.note .btn{margin-left:6px}
/* 홈 */
.collage{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin:18px 0 10px}
.collage img{width:100%;height:150px;object-fit:cover;border-radius:var(--r);display:block;background:#E9E2D3}
.collage figcaption{font-size:12px;color:var(--ink-3);margin-top:4px}
.question{font-family:"Gowun Batang",serif;font-size:21px;line-height:1.45;margin:30px 0 8px;letter-spacing:-.3px}
.preset{padding:18px 0;border-bottom:1px solid var(--line)}
.preset .title{font-family:"Gowun Batang",serif;font-size:19px;font-weight:700}
.preset .isl{font-size:13.5px;color:var(--ink-2);margin:4px 0 8px}
.preset .isl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.preset .why{font-size:14.5px}
.preset.featured{background:var(--page);border:1px solid var(--line-2);border-radius:var(--r);padding:18px 20px;margin:8px 0 6px}
/* 여행 노트(일정) */
.summary{padding:4px 0 10px}
.summary .big{font-family:"Gowun Batang",serif;font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.3}
.summary .isl{font-size:14px;color:var(--ink-2);margin-top:6px}
.summary .isl i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.day{padding:26px 0 22px;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .eyebrow{display:flex;gap:10px;align-items:center}
.day .eyebrow .n{color:var(--rust)}
.day .dtitle{font-family:"Gowun Batang",serif;font-size:21px;font-weight:700;margin:6px 0 2px;letter-spacing:-.3px;line-height:1.35}
.day .dmeta{font-size:13px;color:var(--ink-2)}
.day .dmeta a{color:var(--ink-2);border-bottom-color:var(--line-2)}
.stops{margin-top:12px;border-left:1px solid var(--line-2);margin-left:6px;padding-left:18px}
.stop{position:relative;padding:7px 0;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.stop::before{content:"";position:absolute;left:-22.5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--page);border:1.5px solid var(--ink)}
.stop.res::before{background:var(--rust);border-color:var(--rust)}
.stop .nm{font-weight:600;font-size:15px;cursor:pointer}
.stop .nm:hover{text-decoration:underline;text-underline-offset:3px}
.stop .sm{font-size:13px;color:var(--ink-2)}
.leg{font-size:12px;color:var(--ink-3);padding:0 0 0 0;margin:-2px 0}
.diary{margin-top:12px}
.diary textarea{width:100%;border:0;border-bottom:1px dashed var(--line-2);background:transparent;font-family:"Gowun Batang",serif;font-size:15px;color:var(--ink);padding:6px 0;resize:none;line-height:1.6;min-height:34px}
.diary textarea::placeholder{color:var(--ink-3);font-style:normal}
.diary textarea:focus{outline:none;border-bottom-color:var(--rust)}
.cal{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.cal:last-child{border-bottom:0}
.cal .when{font-family:"Gowun Batang",serif;font-weight:700;color:var(--rust);font-size:15px;line-height:1.3}
.cal .when small{display:block;font-family:Pretendard,sans-serif;font-weight:400;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.ctrl{display:flex;align-items:center;gap:6px}
.ctrl button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);background:transparent;font-weight:700;font-size:15px;line-height:1}
.ctrl input[type=date]{padding:4px 2px;border:0;border-bottom:1px solid var(--line-2);background:transparent;font-family:inherit;font-size:14px;color:var(--ink)}
.ctrl input[type=text]{width:90px;padding:4px 2px;border:0;border-bottom:1px solid var(--line-2);background:transparent;font-family:inherit;font-size:14px;color:var(--ink)}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.setrow:last-child{border-bottom:0}
.empty{padding:10px 0 20px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--page);padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;z-index:9999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 지도 위 */
.legend{position:absolute;left:14px;bottom:14px;z-index:500;background:rgba(255,252,246,.93);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 12px;font-size:12px;max-width:320px;color:var(--ink-2)}
.legend .row{gap:4px 12px}
.legend i{display:inline-flex;width:14px;height:14px;border-radius:50%;align-items:center;justify-content:center;vertical-align:-2px;margin-right:4px;background:var(--ink);color:#fff}
.legend i svg{width:9px;height:9px}
.legend i.r{background:var(--rust)}
.maptools{position:absolute;right:14px;top:14px;z-index:500;display:flex;gap:6px}
.maptools .btn{background:rgba(255,252,246,.95)}
.pin-wrap{background:none;border:0}
.pin{border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--page);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.pin svg{width:58%;height:58%;color:#fff}
.pin:hover{transform:scale(1.15)}
.pin.dim{opacity:.3}
.pin.inb{background:var(--rust);box-shadow:0 0 0 2.5px var(--page),0 0 0 4px var(--rust)}
.pin.small{background:var(--page);border-color:var(--ink);box-shadow:none}
.pin.small svg{color:var(--ink)}
.pin.small.inb{background:var(--rust);border-color:var(--rust)}
.pin.small.inb svg{color:#fff}
.pin-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff}
.isl-label{background:none;border:0}
.isl-pill{transform:translate(-50%,-50%);display:inline-block;white-space:nowrap;background:rgba(255,252,246,.96);border-radius:3px;padding:8px 14px 9px;border:1px solid var(--ink);cursor:pointer;text-align:center;transition:transform .15s;box-shadow:2px 2px 0 var(--line-2)}
.isl-pill:hover{transform:translate(-50%,-50%) scale(1.05)}
.isl-pill b{font-family:"Gowun Batang",serif;font-size:17px;display:block;color:var(--ink);letter-spacing:-.3px;line-height:1.2}
.isl-pill span{font-size:11px;color:var(--ink-2);letter-spacing:.3px}
.area-pill{transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(255,252,246,.97);color:var(--ink);border-radius:3px;padding:4px 10px;font-size:13px;font-weight:600;font-family:"Gowun Batang",serif;border:1px solid var(--ink);cursor:pointer;box-shadow:1.5px 1.5px 0 var(--line-2)}
.area-pill .s{font-family:Pretendard,sans-serif;font-size:11px;color:var(--ink-2);font-weight:500}
.area-pill.cur{background:var(--ink);color:var(--page)} .area-pill.cur .s{color:var(--line)}
.area-pill.dim{opacity:.35}
.area-pill.inb{border-color:var(--rust);box-shadow:1.5px 1.5px 0 var(--rust)}
.hotel-pill{transform:translate(-50%,-100%);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:var(--page);color:var(--ink);border-radius:3px;padding:3px 8px;font-size:12px;font-weight:600;border:1px solid var(--ink);cursor:pointer;position:relative;box-shadow:1.5px 1.5px 0 var(--line-2)}
.hotel-pill::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.hotel-pill.inb{background:var(--rust);color:#fff;border-color:var(--rust)}
.hotel-pill.inb::after{border-top-color:var(--rust)}
.hotel-pill.nolead::after{display:none}
.hotel-pill .num{font-family:"Gowun Batang",serif;font-weight:700}
.route-num{transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:var(--rust);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--page)}
.leaflet-popup-content-wrapper{border-radius:var(--r);box-shadow:0 4px 18px rgba(41,58,54,.18);background:var(--page)}
.leaflet-popup-content{margin:14px 16px;font-family:Pretendard,sans-serif;font-size:13.5px;min-width:230px;line-height:1.5}
.leaflet-popup-content h4{margin:0 0 2px;font-family:"Gowun Batang",serif;font-size:16px}
.pop-img{width:100%;height:120px;object-fit:cover;border-radius:var(--r);margin-bottom:10px;display:block}
.leaflet-control-layers,.leaflet-bar{border:1px solid var(--line-2) !important;box-shadow:none !important;border-radius:var(--r) !important}
@media (max-width: 900px){
  .app{height:auto;min-height:100vh}
  header{flex-wrap:wrap;gap:10px 20px;padding:14px 16px 10px}
  header h1{font-size:24px;white-space:normal}
  .htools{margin-left:0}
  .main{grid-template-columns:1fr;grid-template-rows:50vh auto}
  .panel{border-left:0;border-top:1px solid var(--line-2)}
  .tabs{padding:10px 16px 0;gap:18px}
  .pbody{overflow:visible;padding:20px 16px 60px}
  .pc{grid-template-columns:1fr}
  .legend{display:none}
  .collage{grid-template-columns:1fr 1fr}
}
@media print{
  header .crumbs, .htools, #map, .tabs, .maptools, .legend, .picks, .btn{display:none !important}
  .main{display:block} .pbody{overflow:visible} .panel::before{display:none}
}
</style>

function norm5(r){ if(!r || r.score==null || !isFinite(r.score)) return null; const sc = Number(r.scale)||5; return sc===10 ? r.score/2 : (sc===5 ? r.score : r.score/sc*5); }
function weighted(list){
  let ws=0, s=0;
  for (const r of list||[]){ const v = norm5(r); if(v==null) continue;
    let w = Math.log10((Number(r.count)||40)+10); if (r.verified || /booking|expedia|hotels\.com/i.test(r.source||'')) w *= 1.5;
    s += v*w; ws += w; }
  return ws ? s/ws : null;
}
all('hotels').forEach(h => h.score = weighted(h.ratings));
all('attractions').forEach(a => a.score = norm5(a.rating));
all('restaurants').forEach(r => r.score = norm5(r.rating));
all('experiences').forEach(r => r.score = norm5(r.rating));

  all('attractions').filter(x=>x.areaUid===a.uid && x.rating).forEach(x => pool.push(x.rating));
  a.score = weighted(pool); a.nSrc = pool.filter(r=>norm5(r)!=null).length;
});

/* ---------- 두 사람이 같은 노트를 보도록: Supabase 동기화 ---------- */
const SB = { url: "https://bjdlyjeltwjukuthxkti.supabase.co", key: "sb_publishable_bWlRprbdy8qFs6JgMnmNYw_aJ1veqo7", row: 'main' };
const SYNC = {status:'connecting', lastSeen:'', lastSent:'', timer:null, writing:false, dirty:false, failed:0, pendingRemote:null};
const SYNC_TEXT = {connecting:'노트 연결 중…', saved:'둘이 함께 보는 노트 · 저장됨', saving:'저장 중…', error:'연결 안 됨 · 이 브라우저에만 저장', empty:'둘이 함께 보는 노트 · 아직 비어 있음'};
function setStatus(s){ SYNC.status = s; const el = document.getElementById('sync'); if(!el) return; el.textContent = SYNC_TEXT[s]||''; el.className = 'sync ' + (s==='saved'||s==='empty'||s==='saving' ? 'on' : s==='error' ? 'bad' : ''); }
const stateObj = () => ({picks:S.picks, set:{nights:S.set.nights, start:S.set.start, oahu:S.set.oahu, ovr:S.set.ovr, names:S.set.names, diary:S.set.diary}});
const stateSer = () => JSON.stringify(stateObj());
const sbHeaders = () => ({'apikey': SB.key, 'Authorization': 'Bearer ' + SB.key, 'Content-Type': 'application/json'});
function scheduleSync(){ SYNC.dirty = true; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flushSync, 700); }
async function flushSync(){
  if (SYNC.writing || !SYNC.dirty) return;
  const ser = stateSer(); if (ser === SYNC.lastSent){ SYNC.dirty = false; return; }
  SYNC.writing = true; SYNC.dirty = false; setStatus('saving');
  try {
    const r = await fetch(`${SB.url}/rest/v1/trip_state?on_conflict=id`, {method:'POST', headers:{...sbHeaders(), 'Prefer':'resolution=merge-duplicates,return=representation'}, body: JSON.stringify({id:SB.row, state:JSON.parse(ser), updated_at:new Date().toISOString()})});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json(); SYNC.lastSent = ser; if (rows[0]) SYNC.lastSeen = rows[0].updated_at; SYNC.failed = 0; setStatus('saved');
  } catch(e){ SYNC.dirty = true; SYNC.failed++; setStatus('error'); }
  finally { SYNC.writing = false; if (SYNC.dirty && SYNC.failed < 5) setTimeout(scheduleSync, 3000*SYNC.failed); }
}
function applyRemote(data){
  const incoming = JSON.stringify({picks:data.picks||{}, set:data.set||{}});
  if (incoming === SYNC.lastSent) return;
  const ta = document.activeElement; if (ta && ta.tagName === 'TEXTAREA'){ SYNC.pendingRemote = data; ta.addEventListener('blur', () => { const d = SYNC.pendingRemote; SYNC.pendingRemote = null; if (d) applyRemote(d); }, {once:true}); return; }
  SYNC.lastSent = incoming;
  S.picks = {}; Object.entries(data.picks||{}).forEach(([u,v]) => { if (get(u) && v) S.picks[u] = v; });
  const st = data.set || {}; ['nights','start','oahu','ovr','names','diary'].forEach(k => { if (st[k] !== undefined) S.set[k] = st[k]; });
  if (!S.set.start) S.set.start = DEFAULT_START; if (!Array.isArray(S.set.names) || S.set.names.length < 2) S.set.names = ['남편','아내']; if (!S.set.diary) S.set.diary = {}; if (!S.set.ovr) S.set.ovr = {};
  syncBucket(); try{ localStorage.setItem(LS_KEY, JSON.stringify({picks:S.picks, set:S.set, showRoute:S.showRoute})); }catch(e){}
  refresh();
}
async function pullSync(first){
  try {
    const r = await fetch(`${SB.url}/rest/v1/trip_state?id=eq.${SB.row}&select=state,updated_at`, {headers: sbHeaders(), cache:'no-store'});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();
    if (!rows.length){ if (first){ setStatus('empty'); if (S.bucket.length) scheduleSync(); } return; }
    const row = rows[0];
    if (row.updated_at !== SYNC.lastSeen){ SYNC.lastSeen = row.updated_at; if (!SYNC.writing && !SYNC.dirty) applyRemote(row.state||{}); }
    if (SYNC.status !== 'saving') setStatus('saved');
  } catch(e){ if (first) setStatus('error'); }
}
pullSync(true);
setInterval(() => { if (document.visibilityState === 'visible') pullSync(false); }, 4000);

  if (w >= 1e5) return Math.round(w/1e4).toLocaleString()+'만원';
  return (Math.round(w/100)*100).toLocaleString()+'원'; }

const fixJosa = t => t.replace(/원와/g,'원과').replace(/원로(?!비)/g,'원으로').replace(/원는/g,'원은').replace(/원가 /g,'원이 ').replace(/원를/g,'원을');

function placeHotelPills(){
  LG.hot.clearLayers();
  if (S.level!=='area') return;
  const hs = all('hotels').filter(h => h.areaUid===S.area && okLL(h) && inB(h.uid)).map(h => ({h, p:map.latLngToContainerPoint([h.lat,h.lng])})).sort((a,b)=>a.p.y-b.p.y);
  const placed = [];
  hs.forEach(({h,p}) => {
    const label = `${shortName(h)}`; const w = label.length*8+40, H = 26;
    let dy = -14;
    for (let tries=0; tries<12; tries++){
      const box = {x0:p.x-w/2, x1:p.x+w/2, y0:p.y+dy-H, y1:p.y+dy};
      if (!placed.some(b => !(box.x1<b.x0 || box.x0>b.x1 || box.y1<b.y0 || box.y0>b.y1))) { placed.push(box); break; }
      dy = tries%2 ? -14 - 28*Math.ceil((tries+1)/2) : 16 + 28*Math.ceil((tries+1)/2);
    }
    L.marker([h.lat,h.lng], {icon:L.divIcon({className:'isl-label', iconSize:[0,0], html:`<div class="hotel-pill inb ${Math.abs(dy)>16?'nolead':''}" style="margin-top:${dy+14}px"><span class="num">${h._n||''}</span>${esc(shortName(h))}</div>`}), zIndexOffset:1200})
      .on('click', () => focusCard(h.uid)).addTo(LG.hot);
  });
}

/* ---------- 내비게이션 ---------- */
function goState(){ S.level='state'; S.island=null; S.area=null; S.themes.clear(); map.flyToBounds(STATE_B, {duration:.8}); S.tab='explore'; refresh(); toTop(); }
function goIsland(k){ S.level='island'; S.island=k; S.area=null; S.tab='explore'; map.flyToBounds(ISL_META[k].b, {padding:[20,20], duration:.9}); refresh(); toTop(); }
function goArea(uid, focus){
  const a = DB.areas[uid]; if(!a) return;
  S.level='area'; S.island=a.island; S.area=uid; S.tab='explore'; S.sub='hotels';
  const pts = [a, ...all('hotels').filter(h=>h.areaUid===uid), ...all('restaurants').filter(r=>r.areaUid===uid), ...all('attractions').filter(x=>x.areaUid===uid)].filter(okLL).map(o=>[o.lat,o.lng]);
  if (pts.length>1) map.flyToBounds(L.latLngBounds(pts), {padding:[50,50], maxZoom:a.zoom||14, duration:.9});
  else map.flyTo([a.lat,a.lng], a.zoom||13, {duration:.9});
  map.closePopup();
  refresh(); toTop();
  if (focus) setTimeout(() => focusCard(focus), 350);
}
function toTop(){ document.getElementById('pbody').scrollTop = 0; }
function focusCard(uid){
  const o = get(uid); if (!o) return;
  if (S.tab!=='explore'){ S.tab='explore'; }
  if (S.level!=='area' || S.area!==o.areaUid){ goArea(o.areaUid, uid); return; }
  const want = {hotel:'hotels', attraction:'spots', restaurant:'food', experience:'exp'}[o.kind];
  if (want && S.sub!==want) S.sub = want;
  renderPanel();
  const el = document.getElementById('c-'+cssId(uid)); if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'start'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 1600);
}
const cssId = uid => uid.replace(/[^a-z0-9_-]/gi,'_');
function flyTo(uid){ const o=get(uid); if(okLL(o)) map.flyTo([o.lat,o.lng], Math.max(map.getZoom(), 14), {duration:.7}); }
function setTab(t){ S.tab=t; renderPanel(); toTop(); }
function setSub(t){ S.sub=t; renderPanel(); }
function setSort(t){ S.sort=t; renderPanel(); }
function toggleTheme(t){ S.themes.has(t) ? S.themes.delete(t) : S.themes.add(t); drawMap(); renderPanel(); }
function renderCrumbs(){
  let h = `<button class="${S.level==='state'?'cur':''}" onclick="goState()">하와이 전체</button>`;
  if (S.island){ h += `<span>›</span><button class="${S.level==='island'?'cur':''}" onclick="goIsland('${S.island}')">${esc(DB.islands[S.island].name_ko)}</button>`; }
  if (S.area){ h += `<span>›</span><button class="cur">${esc(DB.areas[S.area].name_ko)}</button>`; }
  document.getElementById('crumbs').innerHTML = h;
}

/* ---------- 패널: 장소 찾기 ---------- */
function renderExplore(){
  if (S.level==='state') return renderState();
  if (S.level==='island') return renderIsland(DB.islands[S.island]);
  return renderArea(DB.areas[S.area]);
}
function heroPhotos(){
  const pref = ['oahu:lanikai_beach','kauai:hanalei_bay','bigisland:punaluu','oahu:waikiki_beach','kauai:waimea_canyon'];
  const pick = pref.map(get).filter(a => a && a.image_url && a.image_ok).slice(0,2);
  if (pick.length<2) all('attractions').filter(a=>a.image_url&&a.image_ok&&!pick.includes(a)).slice(0,2-pick.length).forEach(a=>pick.push(a));
  return pick;
}

function methodNote(){
  return `<details><summary>별점과 가격은 어떻게 매겼나요</summary><div class="sub">

function hav(a,b){ const R=6371, r=Math.PI/180; const dLa=(b.lat-a.lat)*r, dLn=(b.lng-a.lng)*r;

  kauai: { via:{lat:21.98,lng:-159.37}, zoneA: o => o.lat > 22.12 && o.lng > -159.62, zoneB: o => o.lng < -159.55 && o.lat < 22.12 },
  maui:  { via:{lat:20.885,lng:-156.47}, zoneA: o => o.lng > -156.20 && o.lat < 20.95, zoneB: o => o.lng < -156.30 && !(o.lng > -156.20) }
};

function rd(a,b){

const driveMin = (a,b) => { const km = rd(a,b)*1.3; return Math.round(km / (km<12 ? 30 : km<40 ? 45 : 55) * 60); };
function tour(start, pts){

function slotOf(o){
  if (o.kind==='restaurant') return {breakfast:0, lunch:1.6, snack:2, dinner:3.2}[o.meal] ?? 2;
  const t = (o.best_time_ko||'');
  if (/일출|새벽/.test(t)) return -1;
  if (['sunset','stargazing','luau','cruise','dinner'].includes(o.type) || /일몰|선셋|야간|밤/.test(t)) return 2.8;

const isAct = o => o.kind==='attraction' || o.kind==='experience';
function allocNights(order, items){
  const res = {}; let fixed = 0; const free = [];
  order.forEach(k => { const v = S.set.ovr[k]; if (v!=null){ res[k]=v; fixed+=v; } else free.push(k); });
  const N = S.set.nights; let rem = Math.max(0, N - fixed);
  if (free.length){
    const w = free.map(k => 1.5 + items.filter(o=>o.island===k && o.kind!=='hotel').reduce((s,o)=>s+durOf(o),0)/6 + items.filter(o=>o.island===k && o.kind==='hotel').length*0.8);
    const minN = rem >= free.length*3 ? 3 : rem >= free.length*2 ? 2 : 1;
    free.forEach(k => res[k]=minN); let left = rem - minN*free.length;
    if (left>0){ const W=w.reduce((a,b)=>a+b,0); const raw=w.map(x=>x/W*left); const fl=raw.map(Math.floor);

      raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,r).forEach(([,i])=>res[free[i]]++); }
  }

}
function buildPlan(){
  const items = S.bucket.map(get).filter(Boolean);
  if (!items.length) return null;
  const isl = ISLAND_ORDER.filter(k => items.some(o=>o.island===k));
  const nb = ['kauai','maui','bigisland'].filter(k=>isl.includes(k));
  const order = isl.includes('oahu') ? (S.set.oahu==='first' ? ['oahu',...nb] : [...nb,'oahu']) : nb;
  const alloc = allocNights(order, items);
  const totalN = order.reduce((s,k)=>s+alloc[k],0);
  const warns = [], days = []; let dn = 1;
  if (!isl.includes('oahu')) warns.push({lv:'info', t:'한국 직항은 호놀룰루(오아후) 도착이라, 첫날과 마지막 날 호놀룰루 공항에서 주내선 환승이 필요해요.'});
  order.forEach((k, ii) => {
    const n = alloc[k]; const I = DB.islands[k];
    const its = items.filter(o=>o.island===k);

    let acts = its.filter(o=>o.kind!=='hotel' && okLL(o));

      if (hotels.length > n) warns.push({lv:'warn', t:`${I.name_ko}: 담은 호텔(${hotels.length})이 숙박일(${n}박)보다 많아 앞의 ${n}곳만 일정에 넣었어요.`});
    } else {
      const ref = acts.length ? {lat:acts.reduce((s,o)=>s+o.lat,0)/acts.length, lng:acts.reduce((s,o)=>s+o.lng,0)/acts.length} : I.airport;
      const areaPick = its.find(o=>o.kind==='area') || all('areas').filter(a=>a.island===k).sort((a,b)=>hav(ref,a)-hav(ref,b))[0];
      const sug = all('hotels').filter(h=>h.areaUid===areaPick?.uid).sort((a,b)=>(b.score||0)-(a.score||0))[0];
      bases = [{name:'숙소 미정', name_ko:`숙소 미정 (${areaPick?areaPick.name_ko:''} 근처)`, lat:areaPick?.lat??ref.lat, lng:areaPick?.lng??ref.lng, placeholder:true, island:k, sug, areaUid:areaPick?.uid}];
      warns.push({lv:'warn', t:`${I.name_ko}: 아직 호텔을 담지 않았어요.${sug?` 동선으로 보면 ${sug.name_ko||sug.name}(★${sug.score?.toFixed(1)})가 맞아요.`:''}`, uid: sug?.uid});
    }

    const segActs = bases.map(()=>[]);
    acts.forEach(o => { let bi=0, bd=Infinity; bases.forEach((b,i)=>{ const d=rd(b,o); if(d<bd){bd=d;bi=i;} }); segActs[bi].push(o); });
    bases.forEach((b, bi) => {
      const nd = Math.max(1, segN[bi]);
      const caps = Array.from({length:nd}, (_,j) => (dn+j===1) ? 4 : (j===0 && (ii>0 || bi>0)) ? 5 : 8.5);
      const tr = tour(b, segActs[bi]);
      const total = tr.reduce((s,o)=>s+durOf(o),0), capSum = caps.reduce((a,c)=>a+c,0);
      const ratio = Math.min(1, total/capSum);
      const out = caps.map(()=>[]); let d=0, used=0;
      for (const o of tr){ const du=durOf(o);
        while (d<caps.length-1 && used>0 && used+du > Math.max(2.2, caps[d]*ratio*1.2)) { d++; used=0; }
        out[d].push(o); used+=du; }
      const isEve = o => isAct(o) && (['sunset','stargazing','luau','cruise','dinner'].includes(o.type) || /야간|밤|일몰 직후|night/i.test((o.best_time_ko||'')+' '+(o.name||''))), isDawn = o => slotOf(o) < 0;
      for (const test of [isEve, isDawn]){

            l2.filter(o => (isAct(o) || (o.kind==='restaurant' && o.meal==='dinner' && o.areaUid===lg.areaUid)) && durOf(o) < 6 && (hav(o, lg) < 25 || o.areaUid===lg.areaUid) && !isDawn(o) && !(isEve(o) && list.some(isEve)) && !(o.kind==='restaurant' && list.some(x=>x.kind==='restaurant' && x.meal==='dinner')))
              .forEach(o => { l2.splice(l2.indexOf(o),1); list.push(o); });

  days.forEach(d => {

    if (d.drive > 180) warns.push({lv:'warn', t:`${fmtMD(dayDate(d.no))}: 운전만 약 ${Math.round(d.drive/60*10)/10}시간이에요.`});

}
function finishDay(d){
  const base = o => durOf(o) >= 7 && slotOf(o) >= 0 && slotOf(o) < 2.8 ? 0.2 : slotOf(o);

    if (o.kind==='restaurant' && (o.meal==='snack' || o.meal==='lunch')){

  };

const fmtYMD = d => `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}(${'일월화수목금토'[d.getDay()]})`;

function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function seasonPos(d){

  if (m===11){ const f = new Date(d.getFullYear(),10,1).getDay(); const th = 1 + ((4-f+7)%7) + 21; if (day>=th-3 && day<=th+3) return 0.7; }

  const hst = J => { const ms = (J - 2440587.5)*86400000 - 10*3600000; const t = new Date(ms); return `${String(t.getUTCHours()).padStart(2,'0')}:${String(t.getUTCMinutes()).padStart(2,'0')}`; };
  return {rise: hst(Jt - w/360), set: hst(Jt + w/360)};
}

function dayTitle(d){
  const I = DB.islands[d.island];
  if (d.departure) return d.island!=='oahu' ? `${I.name_ko}에서 호놀룰루를 거쳐 집으로` : '호놀룰루에서 집으로';
  const long = d.items.find(o => durOf(o) >= 7);
  const eve = d.items.find(o => slotOf(o) >= 2.8 && isAct(o));
  const dawn = d.items.find(o => slotOf(o) < 0);
  const nm = o => (o.name_ko||o.name).replace(/\s*[\(（].*?[\)）]/g,'').split(/[·–—-]/)[0].trim();
  if (d.arrival) return d.items.length ? `하와이에 닿는 날, ${nm(d.items[d.items.length-1])}` : '하와이에 닿는 날';
  if (long) return `${nm(long)}로 보내는 하루`;
  if (dawn && eve) return `${nm(dawn)}에서 ${nm(eve)}까지`;
  if (dawn) return `${nm(dawn)}, 그리고 느린 오후`;
  const acts = d.items.filter(isAct);
  if (acts.length>=2) return `${nm(acts[0])}와 ${nm(acts[1])}`;
  if (acts.length===1) return eve===acts[0] ? `저녁엔 ${nm(eve)}` : `${nm(acts[0])}에서`;
  if (d.items.length) return `${nm(d.items[0])}에 들르는 날`;
  if (d.transfer) return `${DB.islands[d.transfer].name_ko}에서 ${I.name_ko}로`;
  const area = d.base && d.base.areaUid && DB.areas[d.base.areaUid];
  return `${area?area.name_ko:I.name_ko}에서 느리게 보내는 하루`;
}

function copyPlan(){
  const P = PLAN; if(!P) return;
  const lines = [`우리 둘의 하와이 — ${P.totalN}박 ${P.totalN+1}일 (${fmtYMD(dayDate(1))} 출발)`];
  P.days.forEach(d => {
    const dt = dayDate(d.no);
    if (d.departure){ lines.push(`\nDay ${d.no} ${fmtMD(dt)} ${dayTitle(d)}`); return; }
    const st = sunTimes(dt, d.base.lat, d.base.lng);
    lines.push(`\nDay ${d.no} ${fmtMD(dt)} ${DB.islands[d.island].name_ko} — ${dayTitle(d)}\n  숙소: ${d.base.name_ko||d.base.name} (일출 ${st.rise} / 일몰 ${st.set})`);
    d.items.forEach(o => lines.push(`  · ${o.name_ko||o.name}${needRes(o)?' [예약 필요]':''}${both(o.uid)?' ★우리 둘의 선택':''}`));
    if (!d.items.length) lines.push('  · 자유 일정');
    const dj = S.set.diary[`${S.set.start}#${d.no}`]; if (dj) lines.push(`  ✎ ${dj}`);
  });
  navigator.clipboard?.writeText(lines.join('\n')).then(()=>toast('일정을 복사했어요'), ()=>toast('복사 실패 — 인쇄 기능을 써 주세요'));
}
function drawRoute(){
  LG.route.clearLayers();
  const bt = document.getElementById('routeToggle');
  bt.innerHTML = `${svg('car')} 동선 ${S.showRoute?'숨기기':'보기'}`;
  bt.style.display = PLAN ? '' : 'none';
  if (!PLAN || !S.showRoute) return;
  const P = PLAN;
  P.days.forEach(d => {
    if (d.departure || !d.base) return;
    if (S.level!=='state' && d.island!==S.island) return;
    const pts = [d.base, ...d.items, d.base].filter(okLL).map(o=>[o.lat,o.lng]);
    if (pts.length>2) L.polyline(pts, {color:'#A94F3D', weight:2.5, opacity:.85, dashArray: S.level==='state'?'4 6':null}).addTo(LG.route);
    if (S.level!=='state') d.items.forEach((o,i) => { if(!okLL(o)) return;
      L.marker([o.lat,o.lng], {icon:L.divIcon({className:'isl-label', iconSize:[0,0], html:`<div class="route-num">${d.no}</div>`}), zIndexOffset:1500, interactive:false}).addTo(LG.route); });
  });
  for (let i=1;i<P.order.length;i++){ const a=DB.islands[P.order[i-1]].airport, b=DB.islands[P.order[i]].airport;
    if (okLL(a)&&okLL(b) && S.level==='state') L.polyline([[a.lat,a.lng],[(a.lat+b.lat)/2+0.25,(a.lng+b.lng)/2],[b.lat,b.lng]], {color:'#293A36', weight:1.5, dashArray:'2 7', opacity:.8}).addTo(LG.route); }
}

  const ourS = seasonOf(dayDate(1));
  h += sec('언제 가면 좋을까', (G.seasons||[]).map(s => `<div style="margin:10px 0;${s===ourS?'border-left:2px solid var(--rust);padding-left:12px':''}">${s===ourS?`<div class="eyebrow" style="color:var(--rust)">우리 여행 시기 · ${fmtMD(dayDate(1))} 출발</div>`:''}<b>${esc(s.months)} · ${esc(s.title_ko)}</b> <span class="meta">${({high:'붐빔·비쌈',mid:'보통',low:'한산·저렴'})[s.crowd]||''}</span><div style="font-size:14px">${esc(s.detail_ko)}</div></div>`).join(''));
  h += sec('미리 예약해야 하는 곳', (G.reservations_needed||[]).map(r => `<div style="margin:10px 0"><b>${esc(r.name_ko)}</b> <span class="meta">${esc((DB.islands[r.island]||{}).name_ko||r.island||'')}</span><div style="font-size:14px">${esc(r.detail_ko)}</div>${r.url?`<span class="src-link"><a href="${esc(r.url)}" target="_blank" rel="noopener">예약 페이지</a></span>`:''}</div>`).join(''));
  h += sec('예산 예시 (1인)', (G.budget_example||[]).map(b => `<div style="margin:10px 0"><b>${esc(b.tier_ko)}</b> — ${esc(b.per_person_krw)}<div class="sub">${esc(b.breakdown_ko)}</div></div>`).join(''));
  h += sec('허니문 팁', (G.honeymoon_tips_ko||[]).length?`<ul class="list">${G.honeymoon_tips_ko.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'');
  const tips = Object.values(DB.islands).filter(I=>(I.tips_ko||[]).length);
  if (tips.length) h += sec('섬마다 챙길 것', tips.map(I=>`<div style="margin:10px 0"><b>${esc(I.name_ko)}</b><ul class="list">${I.tips_ko.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join(''));
  h += sec('알아두면 좋은 것', (G.practical||[]).map(e => item(e.title_ko, e.detail_ko, e.source_url)).join(''));
  h += methodNote();
  h += `<p class="meta" style="margin-top:14px">모든 금액은 1달러=${num(FX)}원으로 환산해 원화로 표시${G.exchange_rate_source?` (${esc(G.exchange_rate_source)})`:''} · 숙박세 ${(TAX*100).toFixed(2)}% 적용</p>`;
  return h;
}

function presetSummary(pr){
  const keep = {b:S.bucket, set:JSON.parse(JSON.stringify(S.set))};
  S.bucket = pr.items.filter(u=>get(u)); S.set.ovr = {...pr.ovr}; S.set.oahu = pr.oahu;
  let P = null; try { P = buildPlan(); } catch(e){}
  S.bucket = keep.b; S.set = keep.set;
  return P;
}
function presetCard(pr, featured, compact){
  const P = presetSummary(pr); const n = P ? P.totalN : 0;
  const isl = P ? P.order.map(k=>`<i style="background:${ISL_META[k].c}"></i>${esc(DB.islands[k].name_ko)} ${P.alloc[k]}박`).join(' <span class="muted">→</span> ') : '';
  const names = pr.items.map(get).filter(Boolean).filter(o=>o.kind!=='hotel').slice(0,5).map(o=>esc(o.name_ko||o.name)).join(' · ');
  const hotels = pr.items.map(get).filter(o=>o&&o.kind==='hotel').map(o=>esc(o.name_ko||o.name)).join(' · ');
  return `<div class="preset ${featured?'featured':''}"><div class="row between"><span class="title">${esc(pr.title)}</span><span class="meta">${n}박 ${n+1}일 · 숙박 약 ${P?usd(P.budget.hEst):'-'}</span></div>
    <div class="isl">${isl}</div>
    ${compact?'':`<p class="why">${esc(pr.why)}</p>`}
    <div class="meta" style="margin-top:6px">묵는 곳 — ${hotels}</div>
    <div class="meta">하는 것 — ${names} …</div>
    ${S.pendingPreset===pr.id ? `<div class="confirm-row">지금 담긴 ${S.bucket.length}곳을 이 구성으로 바꿀까요? <button class="btn pri sm" onclick="loadPreset('${pr.id}', true)">바꾸기</button><button class="btn ghost sm" onclick="S.pendingPreset=null;renderPanel()">취소</button></div>` : `<div class="row" style="margin-top:12px"><button class="btn ${featured?'pri':''} sm" onclick="loadPreset('${pr.id}')">이 방식으로 시작</button><button class="btn ghost sm" onclick="addPreset('${pr.id}')">지금 목록에 합치기</button></div>`}</div>`;
}
function loadPreset(id, force){
  const pr = PRESETS.find(x=>x.id===id); if(!pr) return;
  if (S.bucket.length && !force){ S.pendingPreset = id; renderPanel(); return; }
  S.pendingPreset = null;
  S.picks = {}; pr.items.filter(u=>get(u)).forEach(u => S.picks[u]=3); syncBucket();
  S.set.ovr = {...pr.ovr}; S.set.oahu = pr.oahu;
  S.set.nights = Object.values(pr.ovr).reduce((a,b)=>a+b,0);
  save(); S.tab='bucket'; S.level='state'; S.island=null; S.area=null; map.flyToBounds(STATE_B,{duration:.8}); refresh(); toTop();
  toast(`'${pr.title}'로 시작해요 · 마음대로 빼고 더해도 돼요`);
}
function addPreset(id){
  const pr = PRESETS.find(x=>x.id===id); if(!pr) return;
  pr.items.filter(u=>get(u) && !inB(u)).forEach(u=>S.picks[u]=3); syncBucket(); S.set.ovr = {};
  save(); S.tab='bucket'; refresh(); toTop(); toast(`'${pr.title}'의 장소들을 합쳤어요`);
}
function setStart(v){ S.set.start = v || DEFAULT_START; save(); refresh(); toast(`${fmtYMD(dayDate(1))} 출발 기준으로 다시 적었어요`); }
function syncDate(){
  const el = document.getElementById('startDate'); if (el && el.value !== S.set.start) el.value = S.set.start;
  const today = new Date(); today.setHours(0,0,0,0); const diff = Math.round((dayDate(1) - today)/86400000);
  document.getElementById('dday').textContent = diff > 0 ? `D-${diff}` : diff === 0 ? 'D-DAY' : '지난 날짜';
}
function seasonOf(d){
  const m = d.getMonth()+1;
  return (GEN.seasons||[]).find(s => { const mm = (s.months||'').match(/(\d+)\s*~\s*(\d+)/); if(!mm) return false; const a=+mm[1], b=+mm[2]; return a<=b ? (m>=a && m<=b) : (m>=a || m<=b); });
}
function seasonBanner(P){
  const d1 = dayDate(1), dN = dayDate(P.totalN+1), s = seasonOf(d1);
  const whale = (() => { const m=d1.getMonth()+1, dd=d1.getDate(); return (m===12&&dd>=15)||m<=4||(m===5&&dd<=15); })();
  const st = sunTimes(d1, 21.28, -157.83);
  return `<div class="sub" style="margin:14px 0 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><b style="color:var(--ink)">${fmtMD(d1)} ~ ${fmtMD(dN)}${s?` · ${esc(s.title_ko)}`:''}</b>${s?`<div style="margin-top:3px">${esc(s.detail_ko)}</div>`:''}<div class="meta dots" style="margin-top:4px"><span>${whale?'혹등고래 시즌':'고래 시즌 아님 (12/15~5/15)'}</span><span>호놀룰루 일출 ${st.rise} · 일몰 ${st.set}</span><span>호텔 시즌 지수 ${Math.round(seasonPos(d1)*100)}/100</span></div></div>`;
}
function resvCalendar(P){
  const rows = [];
  P.resv.forEach(o => {
    const day = P.days.find(d => d.items.includes(o)); if (!day) return;
    const visit = dayDate(day.no), R = RES_RULE[o.uid];
    if (R){
      R.open.forEach((n, i) => { const od = addDays(visit, -n);
        rows.push({od, html:`<div class="cal"><div class="when">${fmtMD(od)}${R.t?`<small>하와이 ${R.t}<br>한국 ${hstToKst(od, R.t)}</small>`:'<small>시각은 공식 페이지 확인</small>'}</div><div><b>${esc(o.name_ko||o.name)}</b>${R.open.length>1?` <span class="meta">${i===0?'1차':'2차'} 오픈</span>`:''}<div class="sub">방문 Day ${day.no} ${fmtMD(visit)} · ${esc(R.note)}</div>${o.official_url?`<a class="src-link" href="${esc(o.official_url)}" target="_blank" rel="noopener">예약 페이지</a>`:''}</div></div>`});
      });
    } else {
      const od = addDays(visit, -42);
      rows.push({od, html:`<div class="cal"><div class="when">${fmtMD(od)}<small>무렵까지 (권장)</small></div><div><b>${esc(o.name_ko||o.name)}</b> <span class="meta">투어·업체 예약</span><div class="sub">방문 Day ${day.no} ${fmtMD(visit)} · ${esc(o.reservation_ko)}</div>${(o.official_url||o.url)?`<a class="src-link" href="${esc(o.official_url||o.url)}" target="_blank" rel="noopener">예약 페이지</a>`:''}</div></div>`});
    }
  });
  rows.sort((a,b) => a.od - b.od);
  return `<h3>예약이 열리는 날</h3><div>${rows.map(r=>r.html).join('')}</div>
    <div class="meta" style="margin-top:8px">국립·주립공원 예약은 대부분 하와이 시간 기준으로 열려요. 한국 시간은 +19시간이라 보통 다음 날 새벽이에요. 정해진 오픈일이 없는 투어는 방문 6주 전을 권장일로 잡았어요.</div>`;
}
function refresh(){ PLAN = buildPlan(); syncDate(); renderCrumbs(); renderPanel(); drawMap(); }
refresh();
